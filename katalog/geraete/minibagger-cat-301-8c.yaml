  4_stunden: inkl. 1 Schaufel nach Wahl
  tag: inkl. 8 Betriebsstunden und 1 Schaufel nach Wahl
  wochenende: inkl. 12 Betriebsstunden und 1 Schaufel nach Wahl
extras:
