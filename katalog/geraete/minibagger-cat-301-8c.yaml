kaution: 300
beschreibung: >   # ">" = Zeilen werden zu einem Absatz zusammengefügt
  Kompakter Minibagger von Caterpillar in der 1,8-Tonnen-Klasse – ideal
  für Gartenbau, Fundamente, Leitungs- und Drainagegräben, Teichbau,
  Wurzelstöcke und Erdarbeiten auf engem Raum. Im Mietpreis ist eine
  Tieflöffel-Anbauschaufel nach Wahl enthalten: 30 cm, 50 cm oder 100 cm
  breit. Zum Planieren und Böschungen anlegen gibt es zusätzlich eine
  100-cm-Schwenkmulde. Das Laufwerk lässt sich auf 98 cm einfahren, so
  passt der Bagger durch Gartentore und schmale Durchgänge; ausgefahren
  auf 1,34 m steht er beim Arbeiten besonders sicher.
technische_daten:   # Cat-Datenblatt 301.6C/301.8C (HGHH3291-2), Werte 301.8C
  Einsatzgewicht: ca. 1.680 kg (mit Schutzdach)
  Motor: Mitsubishi 3-Zylinder-Diesel, 13,5 kW (18,4 PS)
  Max. Grabtiefe: 2,32 m
  Max. Reichweite: 3,89 m
  Max. Ausschütthöhe: 2,48 m
  Laufwerksbreite: 98 cm eingefahren / 1,34 m ausgefahren
  Transportlänge / -höhe: 3,70 m / 2,19 m
  Zusatzhydraulik: serienmäßig (Hammer/Greifer)
zubehoer:
  - "1 Anbauschaufel nach Wahl: 30 cm, 50 cm oder 100 cm (im Mietpreis enthalten)"
  - Schwenkmulde 100 cm (gegen Aufpreis)
  - Planierschild
hinweise: >
  Transport: Den passenden Transportanhänger können Sie für 17,85 €
  (15 € netto) pro Tag dazumieten. Zum Ziehen brauchen Sie ein Zugfahrzeug mit ausreichender
  Anhängelast und in der Regel einen Führerschein der Klasse BE. Alternativ
  liefern wir den Bagger direkt zu Ihnen (siehe unten).
lieferung: >       # ersetzt für dieses Gerät den Liefertext aus firma.yaml
  Lieferung und Abholung: 5,95 € (5 € netto) pro km einfache Strecke,
  die Rückfahrt wird genauso berechnet. Beispiel: Baustelle 10 km entfernt
  = 119 € (100 € netto) für die Lieferung, ebenso für die Abholung.
