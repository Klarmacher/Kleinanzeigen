einleitung: |
  Werkzeug und Baumaschinen einfach tageweise mieten – statt teuer kaufen.
  Profi-Geräte, gewartet und sofort einsatzbereit.

mietbedingungen: |
  • Übergabe vollgetankt, mit Einweisung und Betriebsanleitung
  • Der Tagespreis gilt für bis zu 8 Stunden Einsatz (Mo–Fr);
    Wochenend- und Feiertagseinsatz bitte vorher absprechen
  • Rückgabe gereinigt und vollgetankt; Kraftstoff wird sonst berechnet
  • Kaution je nach Gerät
  • Während der Mietzeit haftet der Mieter für Beschädigung und Verlust
  Es gelten unsere Allgemeinen Mietbedingungen (Stand August 2026),
  die wir Ihnen gerne vorab zusenden.

lieferung: |
  Lieferung und Abholung auf Anfrage gegen Aufpreis.

